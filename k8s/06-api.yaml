apiVersion: apps/v1
kind: Deployment
metadata:
  name: actorlab-api
  namespace: actorlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actorlab-api
  template:
    metadata:
      labels:
        app: actorlab-api
    spec:
      serviceAccountName: actorlab-api
      containers:
        - name: api
          image: actorlab:latest
          imagePullPolicy: IfNotPresent
          command: ['npm', 'start']
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: actorlab-config
            - secretRef:
                name: actorlab-connections
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: actorlab-api
  namespace: actorlab
spec:
  selector:
    app: actorlab-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
  type: NodePort
